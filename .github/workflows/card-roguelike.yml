name: Check The Fold

on:
  pull_request:
    paths:
      - 'games/card-roguelike/**'
      - '.github/workflows/card-roguelike.yml'
  push:
    branches: [main]
    paths:
      - 'games/card-roguelike/**'
      - '.github/workflows/card-roguelike.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/card-roguelike
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/card-roguelike/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
